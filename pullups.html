<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull-Up Tracker: USA 🇺🇸 and 🇰🇷 KOREA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #c60c30 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: clamp(1.5em, 5vw, 2.5em);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: clamp(1em, 3vw, 1.2em);
            opacity: 0.95;
        }

        .battle-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: clamp(15px, 3vw, 20px);
            margin-bottom: 30px;
        }

        .country-card {
            background: white;
            border-radius: 15px;
            padding: clamp(15px, 3vw, 25px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            min-width: 0;
        }

        .country-card:hover {
            transform: translateY(-5px);
        }

        .country-card.usa {
            border-top: 5px solid #b22234;
        }

        .country-card.korea {
            border-top: 5px solid #c60c30;
        }

        .flag {
            font-size: clamp(2.5em, 8vw, 4em);
            text-align: center;
            margin-bottom: 10px;
        }

        .country-name {
            font-size: clamp(1.2em, 4vw, 1.8em);
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }

        .country-name.usa {
            color: #b22234;
        }

        .country-name.korea {
            color: #c60c30;
        }

        .player-name {
            text-align: center;
            font-size: 1.1em;
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            font-size: clamp(0.95em, 2vw, 1.1em);
            flex-wrap: wrap;
        }

        .stat-line:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-weight: 600;
            color: #555;
        }

        .stat-value {
            font-weight: bold;
            font-size: clamp(1em, 2.5vw, 1.2em);
        }

        .stat-value.usa {
            color: #b22234;
        }

        .stat-value.korea {
            color: #c60c30;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .time-input-wrapper {
            display: flex;
            gap: clamp(8px, 2vw, 10px);
            width: 100%;
        }

        input[type="number"] {
            width: 100%;
            padding: clamp(8px, 2vw, 10px);
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: clamp(0.9em, 2vw, 1em);
            transition: all 0.3s ease;
            min-width: 0;
            font-weight: 500;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        /* Remove default spinner buttons for cleaner look */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"][type="number"] {
            -moz-appearance: textfield;
        }

        input[type="time"] {
            flex: 1;
            min-width: 0;
            padding: clamp(8px, 2vw, 10px);
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: clamp(0.9em, 2vw, 1em);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        input[type="time"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: clamp(10px, 2vw, 12px);
            border: none;
            border-radius: 8px;
            font-size: clamp(0.9em, 2vw, 1em);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add-usa {
            background: #b22234;
            color: white;
        }

        .btn-add-usa:hover {
            background: #8b1a29;
            transform: scale(1.05);
        }

        .btn-add-korea {
            background: #c60c30;
            color: white;
        }

        .btn-add-korea:hover {
            background: #a00826;
            transform: scale(1.05);
        }

        .btn-quick-add {
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 15px);
            border: none;
            border-radius: 8px;
            font-size: clamp(0.8em, 1.5vw, 0.9em);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            white-space: nowrap;
        }

        .btn-quick-add.usa {
            background: #b22234;
        }

        .btn-quick-add.usa:hover {
            background: #8b1a29;
            transform: scale(1.05);
        }

        .btn-quick-add.korea {
            background: #c60c30;
        }

        .btn-quick-add.korea:hover {
            background: #a00826;
            transform: scale(1.05);
        }

        .history {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .history-item {
            padding: clamp(6px, 2vw, 8px);
            margin-bottom: 5px;
            background: white;
            border-left: 4px solid #ddd;
            border-radius: 4px;
            font-size: clamp(0.85em, 1.8vw, 0.95em);
            word-break: break-word;
        }

        .history-item.usa {
            border-left-color: #b22234;
        }

        .history-item.korea {
            border-left-color: #c60c30;
        }

        .leaderboard {
            background: white;
            border-radius: 15px;
            padding: clamp(15px, 3vw, 25px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .leaderboard-title {
            font-size: clamp(1.3em, 4vw, 1.8em);
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(10px, 2vw, 15px);
            border-bottom: 1px solid #eee;
            font-size: clamp(0.95em, 2vw, 1.1em);
            gap: clamp(10px, 2vw, 15px);
            flex-wrap: wrap;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-rank {
            font-weight: bold;
            font-size: clamp(1.1em, 2.5vw, 1.3em);
            min-width: auto;
            flex-shrink: 0;
        }

        .leaderboard-name {
            flex: 1;
            margin: 0 clamp(8px, 2vw, 15px);
            font-weight: 600;
            min-width: 150px;
        }

        .leaderboard-count {
            font-weight: bold;
            font-size: clamp(1em, 2vw, 1.2em);
            min-width: auto;
            text-align: right;
            flex-shrink: 0;
        }

        .victory-banner {
            text-align: center;
            font-size: 2em;
            margin-top: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .separator {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            margin: 20px 0;
        }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container-inline {
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: clamp(150px, 40vw, 250px);
            width: 100%;
            min-width: 0;
        }

        @media (max-width: 1024px) {
            .header h1 {
                font-size: 2em;
            }

            .country-card {
                padding: 20px;
            }

            .leaderboard-name {
                min-width: 120px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .battle-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .history {
                max-height: 200px;
            }

            .chart-wrapper {
                height: 200px;
            }

            .leaderboard-name {
                min-width: 100px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                max-width: 100%;
            }

            .country-card {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 1em;
            }

            .history {
                max-height: 180px;
            }

            .chart-wrapper {
                height: 180px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                min-width: auto;
                width: 100%;
            }

            .leaderboard-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
                text-align: left;
            }

            .leaderboard-name {
                min-width: auto;
                order: 2;
            }

            .leaderboard-rank {
                order: 1;
            }

            .leaderboard-count {
                order: 3;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏋️ PULL-UP Tracker 🏋️</h1>
            <p>One American. One Korean. One Goal.</p>
        </div>

        <div class="battle-section">
            <!-- USA Section -->
            <div class="country-card usa">
                <div class="flag">🇺🇸</div>
                <div class="country-name usa">UNITED STATES</div>
                <div class="player-name">Richard</div>

                <div class="chart-container-inline">
                    <div class="chart-wrapper">
                        <canvas id="usaChart"></canvas>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-line">
                        <span class="stat-label">Total Pull-Ups:</span>
                        <span class="stat-value usa" id="usaTotal">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Days Trained:</span>
                        <span class="stat-value usa" id="usaDays">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Best Day:</span>
                        <span class="stat-value usa" id="usaBest">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Average:</span>
                        <span class="stat-value usa" id="usaAvg">0</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="usaInput">Add Pull-ups (#):</label>
                    <input type="number" id="usaInput" placeholder="Enter number" min="0">
                </div>

                <div class="input-group">
                    <label for="usaTime">Time (optional):</label>
                    <div class="time-input-wrapper">
                        <input type="time" id="usaTime">
                        <button class="btn-quick-add usa" onclick="quickAdd('usa')">+10 Now</button>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-add-usa" onclick="addPullups('usa')">Add Pull-ups 💪</button>
                </div>

                <div class="history">
                    <div class="history-title">📋 History:</div>
                    <div id="usaHistory"></div>
                </div>
            </div>

            <!-- Korea Section -->
            <div class="country-card korea">
                <div class="flag">🇰🇷</div>
                <div class="country-name korea">SOUTH KOREA</div>
                <div class="player-name">Myeongseop</div>

                <div class="chart-container-inline">
                    <div class="chart-wrapper">
                        <canvas id="koreaChart"></canvas>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-line">
                        <span class="stat-label">Total Pull-Ups:</span>
                        <span class="stat-value korea" id="koreaTotal">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Days Trained:</span>
                        <span class="stat-value korea" id="koreaDays">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Best Day:</span>
                        <span class="stat-value korea" id="koreaBest">0</span>
                    </div>
                    <div class="stat-line">
                        <span class="stat-label">Average:</span>
                        <span class="stat-value korea" id="koreaAvg">0</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="koreaInput">Add Pull-ups (#):</label>
                    <input type="number" id="koreaInput" placeholder="Enter number" min="0">
                </div>

                <div class="input-group">
                    <label for="koreaTime">Time (optional):</label>
                    <div class="time-input-wrapper">
                        <input type="time" id="koreaTime">
                        <button class="btn-quick-add korea" onclick="quickAdd('korea')">+10 Now</button>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-add-korea" onclick="addPullups('korea')">Add Pull-ups 💪</button>
                </div>

                <div class="history">
                    <div class="history-title">📋 History:</div>
                    <div id="koreaHistory"></div>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard">
            <div class="leaderboard-title">🏆 ALL-TIME LEADERBOARD 🏆</div>
            <div id="leaderboardContent"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyPR0FwTDQLBoPrL9t9sii6mvlncDHC6iszUQ9WrlrwZN_53VnPsxYW2-Tpydlk8cKC_A/exec";

        // Helper to parse Google Sheets ISO time and get local hours/minutes without timezone conversion
        function parseGoogleSheetsTime(isoTimeString) {
            if (!isoTimeString || typeof isoTimeString !== 'string') return null;
            
            try {
                // Extract the time part from ISO string like "1899-12-31T08:34:00.000Z"
                const timeMatch = isoTimeString.match(/T(\d{2}):(\d{2}):(\d{2})/);
                if (!timeMatch) return null;
                
                let hours = parseInt(timeMatch[1]);
                const minutes = timeMatch[2];
                
                // Google Sheets stores times as UTC, but we want the local time
                // Get the timezone offset (in minutes)
                const now = new Date();
                const tzOffset = now.getTimezoneOffset(); // minutes behind UTC
                
                // Correct the hours by the timezone offset
                // If you're UTC-5 (EST), getTimezoneOffset returns 300
                // We need to SUBTRACT to convert from UTC to local time
                hours = hours - Math.round(tzOffset / 60);
                
                // Handle day wraparound
                if (hours >= 24) hours -= 24;
                if (hours < 0) hours += 24;
                
                return { hours, minutes };
            } catch (e) {
                return null;
            }
        }

        // Helper function to normalize dates consistently
        function normalizeDate(dateStr) {
            try {
                // If it's an ISO string from Google Sheets, parse it
                if (typeof dateStr === 'string' && dateStr.includes('T')) {
                    const date = new Date(dateStr);
                    dateStr = date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                }
            } catch (err) {
                // If parsing fails, use it as-is
            }
            return dateStr;
        }

        // Password protection
        let isAuthenticated = false;
        const CORRECT_PASSWORD = "sayeef"; // Change this to your desired password

        function checkPassword() {
            if (isAuthenticated) return true;
            const password = prompt("Enter password to edit:");
            if (password === CORRECT_PASSWORD) {
                isAuthenticated = true;
                return true;
            } else {
                alert("Incorrect password!");
                return false;
            }
        }

        // Data Structure
        const data = {
            usa: {
                total: 0,
                entries: []
            },
            korea: {
                total: 0,
                entries: []
            }
        };

        // Fetch data from Google Sheets
        async function loadData() {
            try {
                const response = await fetch(API_URL + "?action=getData");
                const result = await response.json();
                if (result.usa && result.korea) {
                    Object.assign(data, result);
                }
            } catch (error) {
                console.error('Error loading data from Google Sheets:', error);
                // Fall back to localStorage if available
                const saved = localStorage.getItem('pullupBattle');
                if (saved) {
                    Object.assign(data, JSON.parse(saved));
                }
            }
            updateDisplay();
        }

        // Save data to Google Sheets
        async function saveToSheets(country, date, count, time) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        country: country,
                        date: date,
                        count: count,
                        time: time
                    })
                });
                const result = await response.json();
                if (result.success) {
                    // Also save to localStorage as backup
                    localStorage.setItem('pullupBattle', JSON.stringify(data));
                }
            } catch (error) {
                console.error('Error saving to Google Sheets:', error);
                alert('Could not save to Google Sheets. Saving locally instead.');
                localStorage.setItem('pullupBattle', JSON.stringify(data));
            }
        }

        // Add pull-ups
        async function addPullups(country) {
            if (!checkPassword()) return;

            const input = document.getElementById(country + 'Input');
            const timeInput = document.getElementById(country + 'Time');
            const count = parseInt(input.value);

            if (!input.value || count < 0) {
                alert('Please enter a valid number!');
                return;
            }

            const today = new Date().toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });

            const time = timeInput.value || '';

            // Update local data first for immediate feedback
            data[country].total += count;
            data[country].entries.push({
                date: today,
                count: count,
                time: time
            });

            input.value = '';
            timeInput.value = '';
            updateDisplay();

            // Save to Google Sheets with normalized date format
            const normalizedDate = new Date(today).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
            await saveToSheets(country, normalizedDate, count, time);
        }

        // Quick add 10 pull-ups
        async function quickAdd(country) {
            if (!checkPassword()) return;

            const today = new Date().toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
            
            // Get current time
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const time = `${hours}:${minutes}`;

            // Update local data
            data[country].total += 10;
            data[country].entries.push({
                date: today,
                count: 10,
                time: time
            });

            updateDisplay();

            // Save to Google Sheets with normalized date format
            const normalizedDate = new Date(today).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
            await saveToSheets(country, normalizedDate, 10, time);
        }

        // Reset data for a country
        function resetData(country) {
            if (confirm(`Are you sure you want to reset ${country.toUpperCase()} data?`)) {
                data[country].total = 0;
                data[country].entries = [];
                localStorage.setItem('pullupBattle', JSON.stringify(data));
                updateDisplay();
                alert('Data reset locally. Note: You may need to manually clear the Google Sheet if desired.');
            }
        }

        // Chart objects
        let usaChartObj = null;
        let koreaChartObj = null;

        // Update charts
        function updateCharts() {
            updateChart('usa');
            updateChart('korea');
        }

        function updateChart(country) {
            const entries = data[country].entries;
            
            // Normalize dates and group entries by date and sum pull-ups per day
            const dailyTotals = {};
            const dateOrder = [];
            
            entries.forEach(e => {
                const normalizedDate = normalizeDate(e.date);
                
                if (!dailyTotals[normalizedDate]) {
                    dailyTotals[normalizedDate] = 0;
                    dateOrder.push(normalizedDate);
                }
                dailyTotals[normalizedDate] += e.count;
            });
            
            const labels = dateOrder.map(date => {
                // Format for display (remove year for cleaner look)
                // date is in format "Feb 3, 2026"
                const parts = date.split(',')[0].trim(); // "Feb 3"
                return parts;
            });
            const values = dateOrder.map(date => dailyTotals[date]);

            const canvasId = country + 'Chart';
            const ctx = document.getElementById(canvasId).getContext('2d');

            // Destroy existing chart if it exists
            if (country === 'usa' && usaChartObj) {
                usaChartObj.destroy();
            } else if (country === 'korea' && koreaChartObj) {
                koreaChartObj.destroy();
            }

            const chartColor = country === 'usa' ? '#b22234' : '#c60c30';
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Pull-ups',
                        data: values,
                        backgroundColor: chartColor,
                        borderColor: chartColor,
                        borderWidth: 1,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 10
                            }
                        }
                    }
                }
            });

            if (country === 'usa') {
                usaChartObj = chart;
            } else {
                koreaChartObj = chart;
            }
        }

        // Update all display elements
        function updateDisplay() {
            updateStats('usa');
            updateStats('korea');
            updateHistory('usa');
            updateHistory('korea');
            updateLeaderboard();
            updateCharts();
        }

        // Update statistics for a country
        function updateStats(country) {
            const entries = data[country].entries;
            
            // Count unique days and calculate daily totals with normalized dates
            const dailyTotals = {};
            entries.forEach(e => {
                const normalizedDate = normalizeDate(e.date);
                dailyTotals[normalizedDate] = (dailyTotals[normalizedDate] || 0) + e.count;
            });
            
            const days = Object.keys(dailyTotals).length;
            const total = Object.values(dailyTotals).reduce((sum, val) => sum + val, 0);
            const best = days > 0 ? Math.max(...Object.values(dailyTotals)) : 0;
            const avg = days > 0 ? Math.round(total / days) : 0;

            document.getElementById(country + 'Total').textContent = total;
            document.getElementById(country + 'Days').textContent = days;
            document.getElementById(country + 'Best').textContent = best;
            document.getElementById(country + 'Avg').textContent = avg;
        }

        // Update history for a country
        function updateHistory(country) {
            const historyDiv = document.getElementById(country + 'History');
            const entries = [...data[country].entries].reverse();

            if (entries.length === 0) {
                historyDiv.innerHTML = '<p style="color: #999; font-style: italic;">No entries yet. Start training!</p>';
                return;
            }

            historyDiv.innerHTML = entries.map(entry => {
                // Parse and format the date
                let dateStr = entry.date;
                try {
                    // If it's an ISO string from Google Sheets, parse it
                    if (typeof dateStr === 'string' && dateStr.includes('T')) {
                        const date = new Date(dateStr);
                        dateStr = date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                    }
                } catch (e) {
                    // If parsing fails, use it as-is
                }
                
                // Format time properly
                let timeStr = '';
                if (entry.time) {
                    try {
                        if (typeof entry.time === 'string') {
                            let hours, minutes;
                            
                            // Try parsing as Google Sheets ISO time first
                            if (entry.time.includes('T')) {
                                const parsed = parseGoogleSheetsTime(entry.time);
                                if (parsed) {
                                    hours = parsed.hours;
                                    minutes = parsed.minutes;
                                }
                            } else if (entry.time.includes(':')) {
                                // Simple HH:MM:SS format
                                const timeParts = entry.time.split(':');
                                hours = parseInt(timeParts[0]);
                                minutes = timeParts[1];
                            }
                            
                            if (hours !== undefined) {
                                const period = hours >= 12 ? 'PM' : 'AM';
                                hours = hours % 12 || 12;
                                timeStr = ` at ${hours}:${minutes} ${period}`;
                            }
                        }
                    } catch (e) {
                        // If conversion fails, skip time
                    }
                }
                
                return `<div class="history-item ${country}">${dateStr}${timeStr}: <strong>${entry.count}</strong> pull-ups 💪</div>`;
            }).join('');
        }

        // Update leaderboard
        function updateLeaderboard() {
            const usaTotal = data.usa.total;
            const koreaTotal = data.korea.total;
            let leaderboardHTML = '';

            if (usaTotal > koreaTotal) {
                leaderboardHTML = `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">🥇</span>
                        <span class="leaderboard-name">Richard (USA) 🇺🇸</span>
                        <span class="leaderboard-count">${usaTotal}</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">🥈</span>
                        <span class="leaderboard-name">Myeongseop (Korea) 🇰🇷</span>
                        <span class="leaderboard-count">${koreaTotal}</span>
                    </div>
                `;
            } else if (koreaTotal > usaTotal) {
                leaderboardHTML = `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">🥇</span>
                        <span class="leaderboard-name">Myeongseop (Korea) 🇰🇷</span>
                        <span class="leaderboard-count">${koreaTotal}</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">🥈</span>
                        <span class="leaderboard-name">Richard (USA) 🇺🇸</span>
                        <span class="leaderboard-count">${usaTotal}</span>
                    </div>
                `;
            } else {
                leaderboardHTML = `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">⚖️</span>
                        <span class="leaderboard-name">Richard (USA) 🇺🇸</span>
                        <span class="leaderboard-count">${usaTotal}</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">⚖️</span>
                        <span class="leaderboard-name">Myeongseop (Korea) 🇰🇷</span>
                        <span class="leaderboard-count">${koreaTotal}</span>
                    </div>
                `;
            }

            document.getElementById('leaderboardContent').innerHTML = leaderboardHTML;
        }

        // Initialize on page load
        loadData();

        // Allow Enter key to submit
        document.getElementById('usaInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addPullups('usa');
        });
        document.getElementById('koreaInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addPullups('korea');
        });
    </script>
</body>
